[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pecheck"
version = "1.1.0"
description = "Static triage for any binary: PE, ELF, scripts, archives, docs"
requires-python = ">=3.9"
dependencies = ["pefile"]

[project.scripts]
pecheck = "pecheck.cli:main"

[tool.setuptools]
packages = ["pecheck", "pecheck.detectors"]
